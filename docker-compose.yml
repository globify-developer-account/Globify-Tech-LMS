# Globify Tech — full stack for local development or a single-server deploy.
#
#   cp .env.example .env     # fill in the secrets first
#   docker compose up -d
#   docker compose exec app pnpm db:deploy && docker compose exec app pnpm db:seed
#
# For production, point DATABASE_URL at your hosted MySQL / MariaDB (Hostinger)
# and drop the mariadb service; keep redis if you want reliable background jobs.
# MariaDB 11.8 matches what Hostinger runs, so behaviour is the same locally.

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_USER: ${DB_USER:-globify}
      MARIADB_PASSWORD: ${DB_PASSWORD:-globify}
      MARIADB_DATABASE: ${DB_NAME:-globify}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-globify-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://${DB_USER:-globify}:${DB_PASSWORD:-globify}@mariadb:3306/${DB_NAME:-globify}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"

  # Background jobs: reminders, risk scoring, PDF rendering, notifications.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: mysql://${DB_USER:-globify}:${DB_PASSWORD:-globify}@mariadb:3306/${DB_NAME:-globify}
      REDIS_URL: redis://redis:6379
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/server/jobs/worker.ts"]

volumes:
  mariadb-data:
  redis-data:
